name: CI (build & test)

# Test-only CI on a single platform (Ubuntu). The full Windows/Mac/Linux/Android
# release-artifact build matrix is scoped to Phase 24 of the Document 25
# roadmap — this workflow is intentionally NOT that yet.
#
# Phase 10: `mtnc` now links LLVM 18 through the `inkwell` crate, so the runner
# needs LLVM 18 development files. `ubuntu-24.04` is pinned on purpose:
# `ubuntu-latest` is being re-pointed to Ubuntu 26.04 (Nov 2026), which no
# longer carries the LLVM 18 packages.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      # Exact name for inkwell's `llvm18-1` feature (llvm-sys 181). A wrong
      # name gives an opaque "could not find LLVM 18.1" error.
      LLVM_SYS_181_PREFIX: /usr/lib/llvm-18
    defaults:
      run:
        working-directory: mtnc
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install LLVM 18 development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libpolly-18-dev libzstd-dev zlib1g-dev libffi-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --verbose

      - name: Run test suite
        # --no-fail-fast: one failing test binary must not hide the results
        # of the remaining ones (every phase gets full results in one run).
        run: cargo test --verbose --no-fail-fast

      - name: Smoke test — mtnc --version
        run: cargo run -- --version

      - name: Smoke test — mtnc check on the examples directory
        run: cargo run -- check examples

      - name: Smoke test — mtnc run examples/hello.mtn (output must match)
        run: |
          actual="$(cargo run --quiet -- run examples/hello.mtn)"
          expected="Hello, Mountain!"
          echo "expected: $expected"
          echo "actual:   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::hello.mtn printed unexpected output"
            exit 1
          fi
